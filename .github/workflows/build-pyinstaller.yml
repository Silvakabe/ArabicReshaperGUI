name: Build with PyInstaller

on: 
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest  # Runs on Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt  # If you have dependencies

      - name: Build executable
        run: |
          pyinstaller --onefile, --name "ReshaperGUI", --windowed, reshapeGUI.py 
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: built-executable
          path: dist/reshapeGUI.exe
          
      - name: Clean up (optional)    
        run: |
          # Optionally clean up the build folder
          rm -rf build dist reshapeGUI.spec

      - name: Notify success (optional)
        run: |
          echo "Build completed successfully!"
