name: Build with PyInstaller

on: 
  push:
    branches:
      - Main
  pull_request:

jobs:
  build:
    runs-on: windows-latest  # Runs on Windows
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.8'
          spec: 'reshapeGUI.spec'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'ReshaperGUI'
          options: --onefile, --name "ReshaperGUI", --windowed
          
      - name: Clean up
        run: |
          Remove-Item -Recurse -Force build, dist, reshapeGUI.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: built-executable
          path: reshapeGUI.exe
      - name: Notify success
        run: |
          echo "Build completed successfully!"
     
