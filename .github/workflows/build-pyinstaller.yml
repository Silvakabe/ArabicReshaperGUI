name: Build PyInstaller and Release

on:
  workflow_dispatch:  # Enables manual triggering

jobs:
  build:
    name: "Build Executable"
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create Executable
        id: pyinstaller  # Added id to reference this step's outcome
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.8'
          spec: 'reshapeGUI.spec'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'reshapeGUI'
          options: --onefile, --name "reshapeGUI", --windowed

      - name: Check PyInstaller success
        run: |
          if [ "${{ steps.pyinstaller.outcome }}" != "success" ]; then
            echo "PyInstaller failed to create the executable."
            exit 1
          fi
        shell: bash

      - name: List dist directory contents
        run: |
          echo "Listing dist directory:"
          dir dist
        shell: bash

      - name: Find executable file
        run: |
          # List contents of dist directory for debugging
          echo "Contents of dist directory:"
          ls -la dist || dir dist
          # Search for the executable with the expected name
          exe_file=$(find dist -iname "reshapeGUI.exe" -type f)
          if [ -z "$exe_file" ]; then
            echo "Executable file 'reshapeGUI.exe' not found in dist directory."
            exit 1
          fi
          echo "Found executable: $exe_file"
          echo "EXE_FILE=$exe_file" >> $GITHUB_ENV
        shell: bash

      - name: Extract version from Python file
        run: |
          version=$(grep "__version__" reshapeGUI.py | cut -d '"' -f2)
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "new_tag=v$version" >> $GITHUB_ENV
        shell: bash

      - name: Check if tag exists
        run: |
          if git rev-parse "refs/tags/${{ env.new_tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.new_tag }} already exists. Aborting."
            exit 1
          fi
        shell: bash

      - name: Create New Tag
        run: |
          git tag ${{ env.new_tag }}
          git push origin ${{ env.new_tag }}
        shell: bash

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.new_tag }}
          release_name: Release ${{ env.new_tag }}
          body: |
            This is the release for version ${{ env.new_tag }}.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename executable
        run: |
          mv "${{ env.EXE_FILE }}" "dist/reshapeGUI-${{ env.new_tag }}.exe"
        shell: bash

      - name: Upload Executable to GitHub Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/reshapeGUI-${{ env.new_tag }}.exe
          asset_name: reshapeGUI-${{ env.new_tag }}.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: |
          Remove-Item -Recurse -Force build, dist, reshapeGUI.spec
        shell: pwsh

      - name: Notify success
        run: |
          echo "Build and release completed successfully!"
        shell: pwsh
